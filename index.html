<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Game Hub - Fixed Universal Edition</title>
    <style>
        :root {
            --neon-blue: #00f0ff;
            --neon-pink: #ff007f;
            --bg-dark: #0a0a12;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* --- NAVIGATION MENU INTERFACE --- */
        #menu-container {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #141526 0%, #05050a 100%);
        }

        #menu-container::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(to right, rgba(0, 240, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            transform: perspective(500px) rotateX(60deg);
            transform-origin: top;
            animation: gridMove 20s linear infinite;
            z-index: 1;
            bottom: 0;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 0 800px; }
        }

        .menu-content {
            position: relative;
            z-index: 2;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 30px;
            width: 90%;
        }

        h1 {
            font-size: 2.5rem;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--neon-blue);
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .btn {
            width: 100%;
            max-width: 280px;
            padding: 15px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid var(--neon-blue);
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
            cursor: pointer;
        }

        .btn:active, .btn:hover {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 25px var(--neon-blue);
        }

        /* --- GAME MECHANICS AND INTERFACE LAYER --- */
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: none;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            width: 100%;
        }

        .hud-panel {
            color: #fff;
            font-family: monospace;
            font-size: 1.1rem;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 15px;
            border-radius: 5px;
            border-left: 3px solid var(--neon-blue);
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 5;
        }

        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: var(--neon-pink);
        }
        #crosshair::before { top: 4px; left: -8px; width: 26px; height: 2px; }
        #crosshair::after { top: -8px; left: 4px; width: 2px; height: 26px; }

        /* Multiplatform Virtual Input Areas */
        .touch-zone {
            position: absolute;
            bottom: 0;
            width: 50%;
            height: 100%;
            z-index: 20;
            touch-action: none;
        }
        
        #left-touch-zone { left: 0; }
        #right-touch-zone { right: 0; }

        #joystick-base {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(0, 240, 255, 0.4);
            border-radius: 50%;
            display: none;
            pointer-events: none;
            z-index: 30;
        }

        #joystick-stick {
            position: absolute;
            width: 40px;
            height: 40px;
            background: var(--neon-blue);
            border-radius: 50%;
            top: 30px;
            left: 30px;
            box-shadow: 0 0 10px var(--neon-blue);
        }

        /* Action Buttons Wrapper */
        #action-container {
            position: absolute;
            bottom: 30px;
            right: 30px;
            display: flex;
            gap: 20px;
            z-index: 30;
            pointer-events: auto;
        }

        .game-btn {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            touch-action: none;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            transition: transform 0.1s;
        }

        #shoot-btn {
            background: rgba(255, 0, 127, 0.3);
            border: 3px solid var(--neon-pink);
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
        }

        #shoot-btn:active {
            background: var(--neon-pink);
            transform: scale(0.9);
        }

        #jump-btn {
            background: rgba(0, 240, 255, 0.3);
            border: 3px solid var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        #jump-btn:active {
            background: var(--neon-blue);
            color: #000;
            transform: scale(0.9);
        }
        
        #fallback-canvas {
            width: 100%;
            height: 100%;
            background-color: #0d1b2a;
        }
    </style>
</head>
<body>

    <!-- MAIN INTERFACE MENU -->
    <div id="menu-container">
        <div class="menu-content">
            <h1>AI GAME HUB</h1>
            <div class="menu-buttons">
                <button class="btn" id="btn-single">Single Player</button>
                <button class="btn" style="border-color:var(--neon-pink)" onclick="alert('Coming soon!')">Multiplayer</button>
            </div>
        </div>
    </div>

    <!-- 3D GAME SCREEN -->
    <div id="game-container">
        <div id="crosshair"></div>
        <div id="left-touch-zone" class="touch-zone"></div>
        <div id="right-touch-zone" class="touch-zone"></div>
        
        <div id="joystick-base"><div id="joystick-stick"></div></div>
        
        <!-- Action Buttons Layout -->
        <div id="action-container">
            <div id="jump-btn" class="game-btn">JUMP</div>
            <div id="shoot-btn" class="game-btn">FIRE</div>
        </div>

        <div id="ui-layer">
            <div class="hud-top">
                <div class="hud-panel" id="score-board">SCORE: 0</div>
                <div class="hud-panel" id="health-board">HP: 100</div>
            </div>
        </div>
        <canvas id="fallback-canvas"></canvas>
    </div>

    <script>
        let score = 0, health = 100;
        let targets = [], bullets = [], pillars = [];
        
        // Physics and Position variables
        let pX = 0, pY = 1.5, pZ = 5; // Eyeline calculation baseline height
        let velocityY = 0;
        const GRAVITY = -0.012;
        const JUMP_FORCE = 0.32;
        let isGrounded = true;

        let rotY = 0, rotX = 0;
        const moveVector = { x: 0, y: 0 };

        const menuContainer = document.getElementById('menu-container');
        const gameContainer = document.getElementById('game-container');
        const btnSingle = document.getElementById('btn-single');
        const scoreBoard = document.getElementById('score-board');
        const healthBoard = document.getElementById('health-board');
        const canvas = document.getElementById('fallback-canvas');
        const ctx = canvas.getContext('2d');

        const leftZone = document.getElementById('left-touch-zone');
        const rightZone = document.getElementById('right-touch-zone');
        const joyBase = document.getElementById('joystick-base');
        const joyStick = document.getElementById('joystick-stick');
        const shootBtn = document.getElementById('shoot-btn');
        const jumpBtn = document.getElementById('jump-btn');

        const triggerStart = () => {
            menuContainer.style.display = 'none';
            gameContainer.style.display = 'block';
            resizeCanvas();
            initEngine();
        };
        btnSingle.addEventListener('click', triggerStart);
        btnSingle.addEventListener('touchstart', (e) => { e.preventDefault(); triggerStart(); });

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);

        function initEngine() {
            for (let i = 0; i < 15; i++) {
                pillars.push({
                    x: (Math.random() - 0.5) * 60,
                    z: (Math.random() - 0.5) * 60,
                    size: 2 + Math.random() * 2
                });
            }
            for (let i = 0; i < 6; i++) spawnTarget();
            setupControls();
            requestAnimationFrame(renderLoop);
        }

        // Action Core Integrators
        function jumpAction() {
            if (isGrounded) {
                velocityY = JUMP_FORCE;
                isGrounded = false;
            }
        }

        function setupControls() {
            let leftTouchId = null, rightTouchId = null;
            let startX = 0, startY = 0, lastX = 0, lastY = 0;

            const handleMoveStart = (id, x, y) => {
                leftTouchId = id;
                joyBase.style.display = 'block';
                joyBase.style.left = `${x - 50}px`;
                joyBase.style.top = `${y - 50}px`;
                startX = x; startY = y;
            };

            const handleMoveProgress = (x, y) => {
                let dx = x - startX, dy = y - startY;
                const max = 40;
                const dist = Math.min(max, Math.sqrt(dx*dx + dy*dy));
                const angle = Math.atan2(dy, dx);
                const mx = Math.cos(angle) * dist, my = Math.sin(angle) * dist;
                joyStick.style.transform = `translate(${mx}px, ${my}px)`;
                moveVector.x = mx / max; moveVector.y = -my / max;
            };

            leftZone.addEventListener('touchstart', (e) => {
                if(leftTouchId !== null) return;
                let t = e.changedTouches[0];
                handleMoveStart(t.identifier, t.clientX, t.clientY);
            });
            leftZone.addEventListener('touchmove', (e) => {
                for(let t of e.changedTouches) {
                    if(t.identifier === leftTouchId) handleMoveProgress(t.clientX, t.clientY);
                }
            });
            leftZone.addEventListener('touchend', (e) => {
                for(let t of e.changedTouches) {
                    if(t.identifier === leftTouchId) {
                        leftTouchId = null; joyBase.style.display = 'none';
                        moveVector.x = 0; moveVector.y = 0;
                    }
                }
            });

            rightZone.addEventListener('touchstart', (e) => {
                if(rightTouchId !== null) return;
                let t = e.changedTouches[0]; rightTouchId = t.identifier;
                lastX = t.clientX; lastY = t.clientY;
            });
            rightZone.addEventListener('touchmove', (e) => {
                for(let t of e.changedTouches) {
                    if(t.identifier === rightTouchId) {
                        rotY -= (t.clientX - lastX) * 0.005;
                        rotX -= (t.clientY - lastY) * 0.005;
                        rotX = Math.max(-Math.PI/2.5, Math.min(Math.PI/2.5, rotX));
                        lastX = t.clientX; lastY = t.clientY;
                    }
                }
            });
            rightZone.addEventListener('touchend', (e) => {
                for(let t of e.changedTouches) { if(t.identifier === rightTouchId) rightTouchId = null; }
            });

            // Fire Action Events Bindings
            shootBtn.addEventListener('touchstart', (e) => { e.preventDefault(); fireBullet(); });
            shootBtn.addEventListener('mousedown', (e) => { e.preventDefault(); fireBullet(); });

            // Jump Action Events Bindings
            jumpBtn.addEventListener('touchstart', (e) => { e.preventDefault(); jumpAction(); });
            jumpBtn.addEventListener('mousedown', (e) => { e.preventDefault(); jumpAction(); });

            // Keyboard Map Routing (Includes Space for Jump)
            window.addEventListener('keydown', (e) => {
                if(e.code === 'KeyW' || e.code === 'ArrowUp') moveVector.y = 1;
                if(e.code === 'KeyS' || e.code === 'ArrowDown') moveVector.y = -1;
                if(e.code === 'KeyA' || e.code === 'ArrowLeft') moveVector.x = -1;
                if(e.code === 'KeyD' || e.code === 'ArrowRight') moveVector.x = 1;
                if(e.code === 'Space') jumpAction();
            });
            window.addEventListener('keyup', (e) => {
                if(['KeyW','KeyS','ArrowUp','ArrowDown'].includes(e.code)) moveVector.y = 0;
                if(['KeyA','KeyD','ArrowLeft','ArrowRight'].includes(e.code)) moveVector.x = 0;
            });

            let mDown = false;
            window.addEventListener('mousedown', (e) => { if(e.target.className === 'touch-zone') mDown = true; });
            window.addEventListener('mouseup', () => mDown = false);
            window.addEventListener('mousemove', (e) => {
                if(!mDown) return;
                rotY -= e.movementX * 0.004;
                rotX -= e.movementY * 0.004;
                rotX = Math.max(-Math.PI/2.5, Math.min(Math.PI/2.5, rotX));
            });
        }

        function spawnTarget() {
            targets.push({
                x: (Math.random() - 0.5) * 40,
                y: 1.5 + Math.random() * 3,
                z: (Math.random() - 0.5) * 40,
                dx: (Math.random() - 0.5) * 0.05,
                dz: (Math.random() - 0.5) * 0.05
            });
        }

        function fireBullet() {
            let cosX = Math.cos(rotX), sinX = Math.sin(rotX);
            let cosY = Math.cos(rotY), sinY = Math.sin(rotY);
            bullets.push({
                x: pX, y: pY, z: pZ,
                vx: -sinY * cosX * 0.8,
                vy: sinX * 0.8,
                vz: -cosY * cosX * 0.8
            });
        }

        function project(x, y, z) {
            // FIX: Inverted coordinate tracking matrix depth to fix map orientation
            let cx = x - pX, cy = y - pY, cz = z - pZ;
            let cosY = Math.cos(-rotY), sinY = Math.sin(-rotY);
            let rx = cx * cosY - cz * sinY;
            let rz = cx * sinY + cz * cosY;
            let cosX = Math.cos(-rotX), sinX = Math.sin(-rotX);
            let ry = cy * cosX - rz * sinX;
            let fz = cy * sinX + rz * cosX;

            // Flipped depth test logic for proper perspective alignment 
            if (fz <= 0.1) return null; 
            let w = canvas.width, h = canvas.height;
            let fov = h / (2 * Math.tan(Math.PI / 8));
            return {
                x: (rx * fov) / fz + w / 2,
                y: (ry * fov) / fz + h / 2,
                depth: fz
            };
        }

        function renderLoop() {
            // Velocity Gravity calculations step
            velocityY += GRAVITY;
            pY += velocityY;
            if (pY <= 1.5) {
                pY = 1.5;
                velocityY = 0;
                isGrounded = true;
            }

            // Movement coordinates translation engine
            let cosY = Math.cos(rotY), sinY = Math.sin(rotY);
            pX += (-moveVector.x * cosY + moveVector.y * sinY) * 0.12;
            pZ += (-moveVector.x * sinY - moveVector.y * cosY) * 0.12;

            // Sky Background Initialization color gradient fill
            let skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            skyGrad.addColorStop(0, '#0a192f');
            skyGrad.addColorStop(1, '#172a45');
            ctx.fillStyle = skyGrad; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // --- ADD SUN OBJECT ELEMENT ---
            let sunPos = project(10, 25, -60); // Placed high up in world coordinates
            if (sunPos) {
                let sunRadius = (450 / sunPos.depth);
                ctx.beginPath();
                ctx.arc(sunPos.x, sunPos.y, Math.max(10, sunRadius), 0, Math.PI * 2);
                ctx.fillStyle = '#fffae6';
                ctx.shadowBlur = 40;
                ctx.shadowColor = '#ffcc00';
                ctx.fill();
                ctx.shadowBlur = 0; // Clear blur layer tracking
            }

            // --- GRASS GREEN RECOLOR DESIGN SURFACE ---
            ctx.strokeStyle = 'rgba(34, 139, 34, 0.4)'; 
            ctx.lineWidth = 1;
            for(let g = -50; g <= 50; g += 4) {
                for(let k = -50; k < 50; k += 4) {
                    let p1 = project(g, 0, k), p2 = project(g, 0, k+4);
                    if(p1 && p2) { ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke(); }
                    let p3 = project(k, 0, g), p4 = project(k+4, 0, g);
                    if(p3 && p4) { ctx.beginPath(); ctx.moveTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y); ctx.stroke(); }
                }
            }

            // Render Arena Obstacles
            pillars.forEach(p => {
                let pt = project(p.x, p.size/2, p.z);
                if(pt) {
                    let s = (40 / pt.depth) * (canvas.height / 500);
                    ctx.fillStyle = '#1b2d42'; ctx.strokeStyle = 'var(--neon-blue)'; ctx.lineWidth = 1;
                    ctx.fillRect(pt.x - s, pt.y - s*2, s*2, s*4); ctx.strokeRect(pt.x - s, pt.y - s*2, s*2, s*4);
                }
            });

            // Update & Render Targets
            for(let i = targets.length - 1; i >= 0; i--) {
                let t = targets[i];
                t.x += t.dx; t.z += t.dz;
                if(Math.abs(t.x) > 35) t.dx *= -1; if(Math.abs(t.z) > 35) t.dz *= -1;

                let distToPlayer = Math.sqrt((t.x-pX)*(t.x-pX) + (t.z-pZ)*(t.z-pZ));
                if(distToPlayer < 2.0) {
                    health -= 0.3; healthBoard.innerText = "HP: " + Math.max(0, Math.floor(health));
                    if(health <= 0) { alert("GAME OVER! Score: " + score); window.location.reload(); return; }
                }

                let pt = project(t.x, t.y, t.z);
                if(pt) {
                    let r = (25 / pt.depth) * (canvas.height / 500);
                    ctx.beginPath(); ctx.arc(pt.x, pt.y, Math.max(2, r), 0, Math.PI*2);
                    ctx.fillStyle = 'var(--neon-pink)'; ctx.shadowBlur = 15; ctx.shadowColor = 'var(--neon-pink)';
                    ctx.fill(); ctx.shadowBlur = 0;
                }
            }

            // Update & Render Bullet Projectiles
            for(let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i]; b.x += b.vx; b.y += b.vy; b.z += b.vz;

                if(Math.abs(b.x) > 50 || Math.abs(b.z) > 50 || b.y < 0 || b.y > 20) { bullets.splice(i, 1); continue; }

                let hit = false;
                for(let j = targets.length - 1; j >= 0; j--) {
                    let t = targets[j];
                    let d = Math.sqrt((b.x-t.x)**2 + (b.y-t.y)**2 + (b.z-t.z)**2);
                    if(d < 1.5) {
                        targets.splice(j, 1); bullets.splice(i, 1); hit = true;
                        score += 10; scoreBoard.innerText = "SCORE: " + score;
                        spawnTarget(); break;
                    }
                }
                if(hit) continue;

                let pt = project(b.x, b.y, b.z);
                if(pt) {
                    ctx.beginPath(); ctx.arc(pt.x, pt.y, Math.max(1, 5 / pt.depth), 0, Math.PI*2);
                    ctx.fillStyle = 'var(--neon-blue)'; ctx.fill();
                }
            }

            requestAnimationFrame(renderLoop);
        }
    </script>
</body>
</html>
