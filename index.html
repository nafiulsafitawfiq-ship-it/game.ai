<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nafiul204ai — Web Game Maker</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #3b82f6;
            --text: #f8fafc;
            --text-dim: #94a3b8;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        h1 { margin: 0 0 10px 0; color: #60a5fa; }
        .config-panel {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            align-items: center;
        }
        input, button, textarea {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 14px;
        }
        input[type="password"] { flex: 1; min-width: 250px; }
        input[type="text"] { flex: 2; min-width: 300px; }
        button {
            background: var(--accent);
            cursor: pointer;
            font-weight: bold;
            border: none;
            transition: background 0.2s;
        }
        button:hover { background: #2563eb; }
        button:disabled {
            background: #475569;
            cursor: not-allowed;
        }
        .status-msg {
            color: #f59e0b;
            font-weight: 500;
            margin-left: 10px;
        }
        .main-layout {
            display: flex;
            gap: 20px;
            flex: 1;
            min-height: 0;
        }
        .pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--card-bg);
            border-radius: 8px;
            padding: 15px;
            overflow: hidden;
        }
        .pane h3 { margin: 0 0 10px 0; display: flex; justify-content: space-between; align-items: center; }
        iframe {
            width: 100%;
            flex: 1;
            border: none;
            background: white;
            border-radius: 6px;
        }
        textarea {
            width: 100%;
            flex: 1;
            resize: none;
            font-family: monospace;
            box-sizing: border-box;
            background: #090d16;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎮 nafiul204ai — AI Game Generator</h1>
        <p style="color: var(--text-dim); margin:0;">Create, preview, and extract fully playable web games directly in your browser.</p>
    </header>

    <div class="config-panel">
        <input type="password" id="apiKey" placeholder="Enter your free Google Gemini API Key">
        <input type="text" id="gamePrompt" placeholder="What game should nafiul204ai build? (e.g., Space Invaders with a neon theme)">
        <button id="generateBtn" onclick="generateGame()">Build Game 🚀</button>
        <span id="status" class="status-msg"></span>
    </div>

    <div class="main-layout">
        <div class="pane">
            <h3>🖥️ Live Web Preview</h3>
            <iframe id="preview"></iframe>
        </div>
        <div class="pane">
            <h3>
                <span>💻 Source Code</span>
                <button onclick="copyCode()" style="padding:4px 10px; font-size:12px;">Copy Code</button>
            </h3>
            <textarea id="codeOutput" readonly placeholder="The generated HTML code will appear here..."></textarea>
        </div>
    </div>

    <script>
        // --- RATE LIMIT DEFENSE SYSTEM ---
        let requestTimestamps = [];
        const MAX_REQUESTS_PER_MINUTE = 10; // Conservative window to guard against 429s

        function checkRateLimit() {
            const now = Date.now();
            // Discard logs older than 60 seconds
            requestTimestamps = requestTimestamps.filter(timestamp => now - timestamp < 60000);
            
            if (requestTimestamps.length >= MAX_REQUESTS_PER_MINUTE) {
                const oldestRequest = requestTimestamps[0];
                const waitTimeSeconds = Math.ceil((60000 - (now - oldestRequest)) / 1000);
                return waitTimeSeconds;
            }
            return 0;
        }

        async function generateGame() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const prompt = document.getElementById('gamePrompt').value.trim();
            const btn = document.getElementById('generateBtn');
            const status = document.getElementById('status');

            if (!apiKey) {
                alert("Please enter your free Gemini API Key.");
                return;
            }
            if (!prompt) {
                alert("Please describe the game you want nafiul204ai to build.");
                return;
            }

            // Cooldown monitoring check
            const cooldownWindow = checkRateLimit();
            if (cooldownWindow > 0) {
                status.innerText = `⏳ Rate limit defense active. Please wait ${cooldownWindow} seconds...`;
                btn.disabled = true;
                setTimeout(() => {
                    btn.disabled = false;
                    status.innerText = "";
                }, cooldownWindow * 1000);
                return;
            }

            // Engage UI Lockout State
            btn.disabled = true;
            status.innerText = "🧠 nafiul204ai is writing code...";

            try {
                // Direct modern REST endpoint targeting the robust gemini-2.5-flash model
                const url = `https://googleapis.com{apiKey}`;

                const systemInstruction = "You are nafiul204ai, an expert game developer. " +
                    "Your job is to generate a fully complete, self-contained, single-file HTML/CSS/JavaScript game based on the user's request. " +
                    "Do not use external assets like image URLs or audio tracks unless they use public placeholders. " +
                    "The game must look modern, dark/cyberpunk themed, use interactive canvas or DOM controls (keyboard/mouse), " +
                    "have a visible live scoring system, and a prominent 'Restart Game' button if the player loses. " +
                    "Return ONLY the valid raw HTML code block enclosed inside standard markdown ```html and ``` tags.";

                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        systemInstruction: { parts: [{ text: systemInstruction }] },
                        generationConfig: { temperature: 0.7 }
                    })
                });

                if (!response.ok) {
                    const errData = await response.json();
                    if (response.status === 429) {
                        throw new Error("Google free limit reached. Cooldown engaged.");
                    }
                    throw new Error(errData.error?.message || "API request failed.");
                }

                // Log entry into the sliding rate limit window
                requestTimestamps.push(Date.now());

                const data = await response.json();
                
                // Navigate Google's JSON response structure safely
                if (!data.candidates || !data.candidates[0].content || !data.candidates[0].content.parts || !data.candidates[0].content.parts[0].text) {
                    throw new Error("Invalid structure returned by the AI.");
                }

                const rawText = data.candidates[0].content.parts[0].text;

                // Strip down formatting markers to process code block cleanly
                const htmlRegex = /```html([\s\S]*?)```/;
                const match = rawText.match(htmlRegex);
                let extractedCode = "";

                if (match && match[1]) {
                    extractedCode = match[1].trim();
                } else if (rawText.includes("<html") || rawText.includes("<HTML")) {
                    extractedCode = rawText.trim();
                } else {
                    throw new Error("AI output was missing structural HTML code. Please retry with a clearer prompt.");
                }

                // Push text to raw editor panel and reload rendering frame source document
                document.getElementById('codeOutput').value = extractedCode;
                const iframe = document.getElementById('preview');
                iframe.srcdoc = extractedCode;

                status.innerText = "🎉 Game Created Successfully!";

            } catch (error) {
                console.error(error);
                status.innerText = `❌ Error: ${error.message}`;
            } finally {
                btn.disabled = false;
            }
        }

        function copyCode() {
            const codeBox = document.getElementById('codeOutput');
            if (!codeBox.value) return;
            codeBox.select();
            document.execCommand('copy');
            alert("Code copied to clipboard!");
        }
    </script>
</body>
</html>
