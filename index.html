<!-- Import Google's official browser-compatible GenAI Web Library module -->
<script type="module">
    import { GoogleGenAI } from 'https://esm.run';

    // --- RATE LIMIT DEFENSE SYSTEM ---
    let requestTimestamps = [];
    const MAX_REQUESTS_PER_MINUTE = 12; 

    function checkRateLimit() {
        const now = Date.now();
        requestTimestamps = requestTimestamps.filter(timestamp => now - timestamp < 60000);
        
        if (requestTimestamps.length >= MAX_REQUESTS_PER_MINUTE) {
            const oldestRequest = requestTimestamps[0];
            const waitTimeSeconds = Math.ceil((60000 - (now - oldestRequest)) / 1000);
            return waitTimeSeconds;
        }
        return 0;
    }

    // Bind function to the global window context so the HTML button can trigger it
    window.generateGame = async function() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const prompt = document.getElementById('gamePrompt').value.trim();
        const btn = document.getElementById('generateBtn');
        const status = document.getElementById('status');

        if (!apiKey) {
            alert("Please enter a valid Google Gemini API Key.");
            return;
        }
        if (!prompt) {
            alert("Please describe the game you want to build.");
            return;
        }

        const cooldownWindow = checkRateLimit();
        if (cooldownWindow > 0) {
            status.innerText = `⏳ Rate limit defense active. Please wait ${cooldownWindow} seconds...`;
            btn.disabled = true;
            setTimeout(() => { btn.disabled = false; status.innerText = ""; }, cooldownWindow * 1000);
            return;
        }

        btn.disabled = true;
        status.innerText = "🧠 nafiul204ai is writing code...";

        try {
            // Initialize the official Google SDK wrapper (avoids manual fetch/CORS bugs)
            const ai = new GoogleGenAI({ apiKey: apiKey });

            const systemInstruction = "You are nafiul204ai, an expert game developer. " +
                "Your job is to generate a fully complete, self-contained, single-file HTML/CSS/JavaScript game based on the user's request. " +
                "Do not use external assets like image URLs or audio tracks unless they use public placeholders. " +
                "The game must look modern, dark/cyberpunk themed, use interactive canvas or DOM controls (keyboard/mouse), " +
                "have a visible live scoring system, and a prominent 'Restart Game' button if the player loses. " +
                "Return ONLY the valid raw HTML code block enclosed inside standard markdown ```html and ``` tags.";

            // Execute using the optimal web wrapper setup
            const response = await ai.models.generateContent({
                model: 'gemini-2.5-flash',
                contents: prompt,
                config: {
                    systemInstruction: systemInstruction,
                    temperature: 0.7
                }
            });

            // Log successful attempt to manage your rate limit pool
            requestTimestamps.push(Date.now());

            const rawText = response.text;
            if (!rawText) throw new Error("Received blank response from AI model.");

            // Extract the generated game
            const htmlRegex = /```html([\s\S]*?)```/;
            const match = rawText.match(htmlRegex);
            let extractedCode = "";

            if (match && match[1]) {
                extractedCode = match[1].trim();
            } else if (rawText.includes("<html") || rawText.includes("<HTML")) {
                extractedCode = rawText.trim();
            } else {
                throw new Error("AI output was missing structural game code. Please retry with a clearer prompt.");
            }

            document.getElementById('codeOutput').value = extractedCode;
            const iframe = document.getElementById('preview');
            iframe.srcdoc = extractedCode;

            status.innerText = "🎉 Game Created Successfully!";

        } catch (error) {
            console.error(error);
            // Catch-all message for debugging
            status.innerText = `❌ Error: ${error.message || "Connection blocked. Turn off ad-blockers and try again."}`;
        } finally {
            btn.disabled = false;
        }
    }

    window.copyCode = function() {
        const codeBox = document.getElementById('codeOutput');
        if (!codeBox.value) return;
        codeBox.select();
        document.execCommand('copy');
        alert("Code copied to clipboard!");
    }
</script>
