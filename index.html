<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nafiul204ai</title>

<style>
body{
    margin:0;
    padding:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#111,#1e1e1e);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:90%;
    max-width:700px;
    background:#222;
    padding:25px;
    border-radius:20px;
    box-shadow:0 0 20px rgba(0,0,0,0.5);
}

h1{
    text-align:center;
    color:#00ffcc;
}

textarea{
    width:100%;
    height:120px;
    border:none;
    outline:none;
    border-radius:12px;
    padding:15px;
    font-size:16px;
    resize:none;
    background:#333;
    color:white;
}

button{
    width:100%;
    margin-top:15px;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#00cc99;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#00ffaa;
}

.output{
    margin-top:20px;
    background:#333;
    padding:15px;
    border-radius:12px;
    min-height:120px;
    line-height:1.7;
}
</style>
</head>

<body>

<div class="container">
    <h1>nafiul204ai</h1>

    <textarea id="userInput" placeholder="Ask something..."></textarea>

    <button onclick="generateParagraph()">Generate Paragraph</button>

    <div class="output" id="output">
        Your paragraph will appear here...
    </div>
</div>

<script>
function generateParagraph(){

    let input = document.getElementById("userInput").value.toLowerCase();
    let output = document.getElementById("output");

    if(input.includes("tea stall")){
        output.innerHTML =
        "A tea stall is a small and popular place where people gather to drink tea and spend time with friends. It is usually found near roads, markets, schools, or bus stations. A tea stall owner prepares fresh tea using milk, sugar, and tea leaves. Many people visit tea stalls every day for relaxation and conversation. It plays an important role in daily social life and is a common sight in many villages and towns.";
    }

    else if(input.includes("school")){
        output.innerHTML =
        "A school is an educational institution where students learn different subjects and develop knowledge and skills. Teachers guide students in their studies and help them become responsible citizens. Schools also teach discipline, honesty, and teamwork. Students participate in sports, cultural programs, and various activities that help build confidence and creativity.";
    }

    else if(input.includes("computer")){
        output.innerHTML =
        "A computer is an electronic device that helps people perform many tasks quickly and accurately. It is used for studying, communication, entertainment, and office work. Computers can store large amounts of information and process data efficiently. In modern life, computers play a very important role in education, business, and technology.";
    }

    else{
        output.innerHTML =
        "This is a well-written paragraph generated by nafiul204ai. The topic you entered is important and useful in daily life. It helps people gain knowledge and understand different aspects of education, society, and technology. A good paragraph should contain clear ideas, proper sentences, and meaningful information presented in an organized way.";
    }
}
</script>

</body>
</html>
