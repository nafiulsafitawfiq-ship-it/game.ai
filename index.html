<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Game Hub - Real Terrain Edition</title>
    <style>
        :root {
            --neon-blue: #00f0ff;
            --neon-pink: #ff007f;
            --bg-dark: #0a0a12;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* --- NAVIGATION MENU INTERFACE --- */
        #menu-container {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #141526 0%, #05050a 100%);
        }

        #menu-container::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(to right, rgba(0, 240, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            transform: perspective(500px) rotateX(60deg);
            transform-origin: top;
            animation: gridMove 20s linear infinite;
            z-index: 1;
            bottom: 0;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 0 800px; }
        }

        .menu-content {
            position: relative;
            z-index: 2;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 30px;
            width: 90%;
        }

        h1 {
            font-size: 2.5rem;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--neon-blue);
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .btn {
            width: 100%;
            max-width: 280px;
            padding: 15px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid var(--neon-blue);
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
            cursor: pointer;
        }

        .btn:active, .btn:hover {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 25px var(--neon-blue);
        }

        /* --- GAME MECHANICS AND INTERFACE LAYER --- */
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: none;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            width: 100%;
        }

        .hud-panel {
            color: #fff;
            font-family: monospace;
            font-size: 1.1rem;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 15px;
            border-radius: 5px;
            border-left: 3px solid var(--neon-blue);
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 5;
        }

        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: var(--neon-pink);
        }
        #crosshair::before { top: 4px; left: -8px; width: 26px; height: 2px; }
        #crosshair::after { top: -8px; left: 4px; width: 2px; height: 26px; }

        /* Controls Input Zones */
        .touch-zone {
            position: absolute;
            bottom: 0;
            width: 50%;
            height: 100%;
            z-index: 20;
            touch-action: none;
        }
        
        #left-touch-zone { left: 0; }
        #right-touch-zone { right: 0; }

        #joystick-base {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(0, 240, 255, 0.4);
            border-radius: 50%;
            display: none;
            pointer-events: none;
            z-index: 30;
        }

        #joystick-stick {
            position: absolute;
            width: 40px;
            height: 40px;
            background: var(--neon-blue);
            border-radius: 50%;
            top: 30px;
            left: 30px;
            box-shadow: 0 0 10px var(--neon-blue);
        }

        /* Action Buttons Area */
        #action-container {
            position: absolute;
            bottom: 30px;
            right: 30px;
            display: flex;
            gap: 20px;
            z-index: 30;
            pointer-events: auto;
        }

        .game-btn {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            touch-action: none;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            transition: transform 0.1s;
        }

        #shoot-btn {
            background: rgba(255, 0, 127, 0.3);
            border: 3px solid var(--neon-pink);
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
        }

        #shoot-btn:active {
            background: var(--neon-pink);
            transform: scale(0.9);
        }

        #jump-btn {
            background: rgba(0, 240, 255, 0.3);
            border: 3px solid var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        #jump-btn:active {
            background: var(--neon-blue);
            color: #000;
            transform: scale(0.9);
        }
        
        #fallback-canvas {
            width: 100%;
            height: 100%;
            background-color: #0c1c24;
        }
    </style>
</head>
<body>

    <!-- MAIN INTERFACE MENU -->
    <div id="menu-container">
        <div class="menu-content">
            <h1>AI GAME HUB</h1>
            <div class="menu-buttons">
                <button class="btn" id="btn-single">Single Player</button>
                <button class="btn" style="border-color:var(--neon-pink)" onclick="alert('Coming soon!')">Multiplayer</button>
            </div>
        </div>
    </div>

    <!-- 3D GAME SCREEN -->
    <div id="game-container">
        <div id="crosshair"></div>
        <div id="left-touch-zone" class="touch-zone"></div>
        <div id="right-touch-zone" class="touch-zone"></div>
        
        <div id="joystick-base"><div id="joystick-stick"></div></div>
        
        <!-- Action Layout Control Buttons -->
        <div id="action-container">
            <div id="jump-btn" class="game-btn">JUMP</div>
            <div id="shoot-btn" class="game-btn">FIRE</div>
        </div>

        <div id="ui-layer">
            <div class="hud-top">
                <div class="hud-panel" id="score-board">SCORE: 0</div>
                <div class="hud-panel" id="health-board">HP: 100</div>
            </div>
        </div>
        <canvas id="fallback-canvas"></canvas>
    </div>

    <script>
        let score = 0, health = 100;
        let targets = [], bullets = [], pillars = [], grassBlades = [];
        
        // Coordinates and Position Mechanics
        let pX = 0, pY = 1.2, pZ = 8; 
        let velocityY = 0;
        const GRAVITY = -0.015;
        const JUMP_FORCE = 0.35;
        let isGrounded = true;

        let rotY = 0, rotX = 0;
        const moveVector = { x: 0, y: 0 };

        const menuContainer = document.getElementById('menu-container');
        const gameContainer = document.getElementById('game-container');
        const btnSingle = document.getElementById('btn-single');
        const scoreBoard = document.getElementById('score-board');
        const healthBoard = document.getElementById('health-board');
        const canvas = document.getElementById('fallback-canvas');
        const ctx = canvas.getContext('2d');

        const leftZone = document.getElementById('left-touch-zone');
        const rightZone = document.getElementById('right-touch-zone');
        const joyBase = document.getElementById('joystick-base');
        const joyStick = document.getElementById('joystick-stick');
        const shootBtn = document.getElementById('shoot-btn');
        const jumpBtn = document.getElementById('jump-btn');

        const triggerStart = () => {
            menuContainer.style.display = 'none';
            gameContainer.style.display = 'block';
            resizeCanvas();
            initEngine();
        };
        btnSingle.addEventListener('click', triggerStart);
        btnSingle.addEventListener('touchstart', (e) => { e.preventDefault(); triggerStart(); });

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);

        function initEngine() {
            // GENERATE REALISTIC BLADES OF GRASS PERSISTENT FIELDS
            // Generates 1,200 distinct grass positions across the map coordinate spectrum
            for (let i = 0; i < 1200; i++) {
                let greenVariations = ['#1e4620', '#2d6a4f', '#40916c', '#52b788', '#1b4332'];
                grassBlades.push({
                    x: (Math.random() - 0.5) * 50,
                    z: (Math.random() - 0.5) * 50,
                    height: 0.15 + Math.random() * 0.25,
                    color: greenVariations[Math.floor(Math.random() * greenVariations.length)]
                });
            }

            // Generate map pillars
            for (let i = 0; i < 15; i++) {
                pillars.push({
                    x: (Math.random() - 0.5) * 60,
                    z: (Math.random() - 0.5) * 60,
                    size: 3 + Math.random() * 3
                });
            }
            // Spawn initial targets
            for (let i = 0; i < 5; i++) spawnTarget();
            setupControls();
            requestAnimationFrame(renderLoop);
        }

        function jumpAction() {
            if (isGrounded) {
                velocityY = JUMP_FORCE;
                isGrounded = false;
            }
        }

        function setupControls() {
            let leftTouchId = null, rightTouchId = null;
            let startX = 0, startY = 0, lastX = 0, lastY = 0;

            const handleMoveStart = (id, x, y) => {
                leftTouchId = id;
                joyBase.style.display = 'block';
                joyBase.style.left = `${x - 50}px`;
                joyBase.style.top = `${y - 50}px`;
                startX = x; startY = y;
            };

            const handleMoveProgress = (x, y) => {
                let dx = x - startX, dy = y - startY;
                const max = 40;
                const dist = Math.min(max, Math.sqrt(dx*dx + dy*dy));
                const angle = Math.atan2(dy, dx);
                const mx = Math.cos(angle) * dist, my = Math.sin(angle) * dist;
                joyStick.style.transform = `translate(${mx}px, ${my}px)`;
                moveVector.x = mx / max; moveVector.y = -my / max;
            };

            leftZone.addEventListener('touchstart', (e) => {
                if(leftTouchId !== null) return;
                let t = e.changedTouches;
                handleMoveStart(t.identifier, t.clientX, t.clientY);
            });
            leftZone.addEventListener('touchmove', (e) => {
                for(let t of e.changedTouches) {
                    if(t.identifier === leftTouchId) handleMoveProgress(t.clientX, t.clientY);
                }
            });
            leftZone.addEventListener('touchend', (e) => {
                for(let t of e.changedTouches) {
                    if(t.identifier === leftTouchId) {
                        leftTouchId = null; joyBase.style.display = 'none';
                        moveVector.x = 0; moveVector.y = 0;
                    }
                }
            });

            rightZone.addEventListener('touchstart', (e) => {
                if(rightTouchId !== null) return;
                let t = e.changedTouches; rightTouchId = t.identifier;
                lastX = t.clientX; lastY = t.clientY;
            });
            rightZone.addEventListener('touchmove', (e) => {
                for(let t of e.changedTouches) {
                    if(t.identifier === rightTouchId) {
                        rotY -= (t.clientX - lastX) * 0.005;
                        rotX += (t.clientY - lastY) * 0.005; 
                        rotX = Math.max(-Math.PI/3, Math.min(Math.PI/3, rotX));
                        lastX = t.clientX; lastY = t.clientY;
                    }
                }
            });
            rightZone.addEventListener('touchend', (e) => {
                for(let t of e.changedTouches) { if(t.identifier === rightTouchId) rightTouchId = null; }
            });

            shootBtn.addEventListener('touchstart', (e) => { e.preventDefault(); fireBullet(); });
            shootBtn.addEventListener('mousedown', (e) => { e.preventDefault(); fireBullet(); });

            jumpBtn.addEventListener('touchstart', (e) => { e.preventDefault(); jumpAction(); });
            jumpBtn.addEventListener('mousedown', (e) => { e.preventDefault(); jumpAction(); });

            window.addEventListener('keydown', (e) => {
                if(e.code === 'KeyW' || e.code === 'ArrowUp') moveVector.y = 1;
                if(e.code === 'KeyS' || e.code === 'ArrowDown') moveVector.y = -1;
                if(e.code === 'KeyA' || e.code === 'ArrowLeft') moveVector.x = -1;
                if(e.code === 'KeyD' || e.code === 'ArrowRight') moveVector.x = 1;
                if(e.code === 'Space') jumpAction();
            });
            window.addEventListener('keyup', (e) => {
                if(['KeyW','KeyS','ArrowUp','ArrowDown'].includes(e.code)) moveVector.y = 0;
                if(['KeyA','KeyD','ArrowLeft','ArrowRight'].includes(e.code)) moveVector.x = 0;
            });

            let mDown = false;
            window.addEventListener('mousedown', (e) => { if(e.target.className === 'touch-zone') mDown = true; });
            window.addEventListener('mouseup', () => mDown = false);
            window.addEventListener('mousemove', (e) => {
                if(!mDown) return;
                rotY -= e.movementX * 0.004;
                rotX += e.movementY * 0.004;
                rotX = Math.max(-Math.PI/3, Math.min(Math.PI/3, rotX));
            });
        }

        function spawnTarget() {
            targets.push({
                x: (Math.random() - 0.5) * 30,
                y: 1.0 + Math.random() * 2,
                z: (Math.random() - 0.5) * 30,
                dx: (Math.random() - 0.5) * 0.04,
                dz: (Math.random() - 0.5) * 0.04
            });
        }

        function fireBullet() {
            let cosX = Math.cos(rotX), sinX = Math.sin(rotX);
            let cosY = Math.cos(rotY), sinY = Math.sin(rotY);
            bullets.push({
                x: pX, 
                y: pY - 0.1, 
                z: pZ,
                vx: -sinY * cosX * 0.6,
                vy: -sinX * 0.6, 
                vz: -cosY * cosX * 0.6,
                life: 60 
            });
        }

        function project(x, y, z) {
            let cx = x - pX, cy = y - pY, cz = z - pZ;
            
            let cosY = Math.cos(-rotY), sinY = Math.sin(-rotY);
            let rx = cx * cosY - cz * sinY;
            let rz = cx * sinY + cz * cosY;
            
            let cosX = Math.cos(-rotX), sinX = Math.sin(-rotX);
            let ry = cy * cosX + rz * sinX; 
            let fz = -cy * sinX + rz * cosX; 

            if (fz <= 0.1) return null; 
            
            let w = canvas.width, h = canvas.height;
            let scale = h / (2 * Math.tan(Math.PI / 6)); 
            return {
                x: (rx * scale) / fz + w / 2,
                y: -(ry * scale) / fz + h / 2, 
                depth: fz
            };
        }

        function renderLoop() {
            // Update physics
            velocityY += GRAVITY;
            pY += velocityY;
            if (pY <= 1.2) { pY = 1.2; velocityY = 0; isGrounded = true; }

            let cosY = Math.cos(rotY), sinY = Math.sin(rotY);
            pX += (-moveVector.x * cosY + moveVector.y * sinY) * 0.1;
            pZ += (-moveVector.x * sinY - moveVector.y * cosY) * 0.1;

            pX = Math.max(-24, Math.min(24, pX));
            pZ = Math.max(-24, Math.min(24, pZ));

            // Render deep gradient sky box
            let sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
            sky.addColorStop(0, '#0c1a2c'); sky.addColorStop(0.5, '#152b44'); sky.addColorStop(1, '#203d59');
            ctx.fillStyle = sky; ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Render sun object element
            let sun = project(5, 18, -40);
            if(sun) {
                ctx.beginPath(); ctx.arc(sun.x, sun.y, 400/sun.depth, 0, Math.PI*2);
                ctx.fillStyle = '#fffae6'; ctx.shadowBlur = 35; ctx.shadowColor = '#ffaa00';
                ctx.fill(); ctx.shadowBlur = 0;
            }

            // --- REALISTIC TYPE GRASS TERRAIN RENDERING CONTEXT ---
            // Draw a solid organic dark earth/moss baseline structure underneath the blades
            let horizonY = canvas.height / 2; // Default baseline fallback height parameter
            ctx.fillStyle = '#14251c';
            ctx.fillRect(0, horizonY - 100, canvas.width, canvas.height);

            // Sort grass elements by distance (depth) to avoid overlapping rendering glitches
            let renderedGrass = [];
            grassBlades.forEach(g => {
                let ptBase = project(g.x, 0, g.z);
                let ptTop = project(g.x, g.height, g.z);
                if (ptBase && ptTop) {
                    renderedGrass.push({ base: ptBase, top: ptTop, color: g.color, depth: ptBase.depth });
                }
            });
            renderedGrass.sort((a, b) => b.depth - a.depth);

            // Draw individual organic grass clusters onto the canvas space context
            renderedGrass.forEach(g => {
                let thickness = Math.max(1, 15 / g.depth);
                ctx.beginPath();
                ctx.moveTo(g.base.x, g.base.y);
                // Curve the grass slightly using a control point calculation to make it look organic
                ctx.quadraticCurveTo(g.base.x + (thickness * 0.5), g.top.y, g.top.x + (thickness * 0.2), g.top.y);
                ctx.strokeStyle = g.color;
                ctx.lineWidth = thickness;
                ctx.lineCap = 'round';
                ctx.stroke();
            });

            // Render map structures
            pillars.forEach(p => {
                let pt = project(p.x, p.size/2, p.z);
                if(pt) {
                    let s = (45 / pt.depth);
                    ctx.fillStyle = '#162e4a'; ctx.strokeStyle = 'var(--neon-blue)'; ctx.lineWidth = 1;
                    ctx.fillRect(pt.x - s, pt.y - s*2, s*2, s*4); ctx.strokeRect(pt.x - s, pt.y - s*2, s*2, s*4);
                }
            });

            // Update/Render Targets
            for(let i = targets.length - 1; i >= 0; i--) {
                let t = targets[i];
                t.x += t.dx; t.z += t.dz;
                if(Math.abs(t.x) > 25) t.dx *= -1; if(Math.abs(t.z) > 25) t.dz *= -1;

                let playerDist = Math.sqrt((t.x-pX)**2 + (t.z-pZ)**2);
                if(playerDist < 1.8) {
                    health -= 0.4; healthBoard.innerText = "HP: " + Math.max(0, Math.floor(health));
                    if(health <= 0) { alert("GAME OVER! Score: " + score); window.location.reload(); return; }
                }

                let pt = project(t.x, t.y, t.z);
                if(pt) {
                    let r = (28 / pt.depth);
                    ctx.beginPath(); ctx.arc(pt.x, pt.y, Math.max(3, r), 0, Math.PI*2);
                    ctx.fillStyle = 'var(--neon-pink)'; ctx.shadowBlur = 15; ctx.shadowColor = 'var(--neon-pink)';
                    ctx.fill(); ctx.shadowBlur = 0;
                }
            }

            // Update/Render Projectiles and Collision Tracking
            for(let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.vx; b.y += b.vy; b.z += b.vz;
                b.life--;

                if(b.life <= 0 || Math.abs(b.x) > 40 || Math.abs(b.z) > 40 || b.y < 0) { bullets.splice(i, 1); continue; }

                let hitRegistered = false;
                for(let j = targets.length - 1; j >= 0; j--) {
                    let t = targets[j];
                    let bulletRadiusHit = Math.sqrt((b.x-t.x)**2 + (b.y-t.y)**2 + (b.z-t.z)**2);
                    
                    if(bulletRadiusHit < 1.6) { 
                        targets.splice(j, 1); bullets.splice(i, 1); hitRegistered = true;
                        score += 10; scoreBoard.innerText = "SCORE: " + score;
                        spawnTarget(); break;
                    }
                }
                if(hitRegistered) continue;

                let pt = project(b.x, b.y, b.z);
                if(pt) {
                    ctx.beginPath(); ctx.arc(pt.x, pt.y, Math.max(2, 6 / pt.depth), 0, Math.PI*2);
                    ctx.fillStyle = 'var(--neon-blue)'; ctx.shadowBlur = 10; ctx.shadowColor = 'var(--neon-blue)';
                    ctx.fill(); ctx.shadowBlur = 0;
                }
            }

            requestAnimationFrame(renderLoop);
        }
    </script>
</body>
</html>
