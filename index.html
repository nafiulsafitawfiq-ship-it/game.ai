<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nafiul204ai</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.box{
    width:90%;
    max-width:700px;
    background:#1e1e1e;
    padding:20px;
    border-radius:20px;
}

h1{
    text-align:center;
    color:#00ffcc;
}

input{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#333;
    color:white;
    font-size:16px;
}

button{
    width:100%;
    padding:15px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:#00cc99;
    color:white;
    font-size:18px;
    cursor:pointer;
}

.output{
    margin-top:20px;
    background:#333;
    padding:15px;
    border-radius:10px;
    min-height:150px;
    line-height:1.7;
}
</style>
</head>

<body>

<div class="box">
    <h1>nafiul204ai</h1>

    <input type="text" id="topic" placeholder="Enter any topic...">

    <button onclick="generateAI()">Generate</button>

    <div class="output" id="output">
        AI paragraph will appear here...
    </div>
</div>

<script>
async function generateAI(){

    let topic = document.getElementById("topic").value;
    let output = document.getElementById("output");

    if(topic.trim() === ""){
        output.innerHTML = "Please enter a topic.";
        return;
    }

    output.innerHTML = "Generating AI paragraph...";

    try{

        let response = await fetch(
            "https://api-inference.huggingface.co/models/gpt2",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    inputs:"Write a good paragraph about " + topic
                })
            }
        );

        let data = await response.json();

        output.innerHTML = data[0].generated_text;

    }catch(error){
        output.innerHTML = "Error loading AI response.";
    }
}
</script>

</body>
</html>
